# Iris face authentication — system configuration
#
# Installed to /etc/iris/config.toml. Owned by root, mode 0644.
# The daemon re-reads this on SIGHUP; `iris config set <key> <value>` edits it safely.
# A malformed file is NOT fatal: iris.config falls back to built-in defaults and logs,
# so a bad edit here can never lock you out.

[camera]
# "auto" uses the first infrared camera Iris finds, which is right for most laptops
# and survives /dev/video* being renumbered. To see what this machine has:
#   iris cameras
# To pin a specific node instead:
#   sudo iris config set camera.device /dev/videoN
# Never pick a node marked "metadata": it carries UVC headers, not images, and the
# daemon refuses it. IR is strongly preferred over a colour camera: it works in the
# dark and a phone or monitor replay emits no 850nm light.
# If your IR camera is not found or does not work, run  iris hardware-report  and
# open a hardware issue on GitHub with its output.
device = "auto"
# Requested frame size. The camera may pick the nearest size it supports; that is fine.
width = 640
height = 360

# Many IR emitters STROBE: alternating frames are dark and lit (on the original test
# laptop, mean ~1 and ~55-62). With ir_mode on, the daemon discards frames dimmer than
# min_frame_brightness so recognition only ever sees illuminated frames. Turning this
# off on a strobing IR camera will make authentication fail roughly half the time.
# `iris doctor` measures your camera's lit and dark levels.
ir_mode = true
min_frame_brightness = 20.0

[recognition]
# Cosine similarity required to call it a match. Upstream SFace default is 0.363.
# Measured on this hardware, genuine same-person pairs scored min 0.621 / p5 0.738,
# so 0.363 has a wide safety margin. See docs/CALIBRATION.md — 0.5 is a defensible
# hardening step if you want tighter impostor rejection:
#   sudo iris config set recognition.threshold 0.5
threshold = 0.363

# YuNet detection confidence floor before a region is treated as a face.
detect_score = 0.7

model_dir = "/usr/share/iris/models"

# Consecutive matching frames required before success. This is the real defence
# against a single lucky frame; at ~15fps with half the frames dark, 3 costs ~0.4s.
required_matches = 3

# Hard cap on frames examined in one attempt, so a bad camera cannot spin forever.
max_frames = 120

[auth]
# Master switch. false => the daemon answers every auth request with reason "disabled"
# and PAM falls through to password. The fastest way to turn Iris off without touching PAM.
enabled = true

# Wall-clock budget for one attempt, in seconds. Past this the answer is "timeout"
# and you get the password prompt.
timeout = 8.0

# Rate limiting: after max_failures failures, refuse for lockout_seconds.
max_failures = 5
lockout_seconds = 60

[liveness]
# IR-native spoof resistance. See docs/SECURITY.md for what this does and does not stop.
enabled = true
min_variance = 12.0
